services:
  api:
    container_name: wombat-api
    build:
      context: .
      dockerfile: Dockerfile
    image: wombat-api:latest
    ports:
      - "8100:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  frontend:
    container_name: wombat-frontend
    build:
      context: ./client
      dockerfile: Dockerfile
    image: wombat-frontend:latest
    ports:
      - "8101:80"
    restart: unless-stopped
    depends_on:
      - api